# Demo stack: 3 gateway replicas behind one port range, 2 mock upstreams, Redis, Prometheus, Grafana.
#   docker compose -f deploy/docker-compose.yml up --build
#   curl localhost:8081/v1/chat/completions -H 'authorization: Bearer sk-alpha' \
#     -d '{"model":"demo","stream":true,"messages":[{"role":"user","content":"hi"}]}'
#   Grafana: http://localhost:3000 (anonymous admin)
x-gateway: &gateway
  build: ..
  command: ["serve", "-c", "/etc/hardcap/config.yaml"]
  volumes: ["./config.yaml:/etc/hardcap/config.yaml:ro"]
  depends_on: [redis, mock-a, mock-b]

services:
  redis:
    image: redis:7-alpine
  mock-a:
    build: ..
    command: ["mock", "--host", "0.0.0.0", "--port", "9001", "--ttft-ms", "200", "--tpot-ms", "20"]
  mock-b:
    build: ..
    command: ["mock", "--host", "0.0.0.0", "--port", "9001", "--ttft-ms", "100", "--tpot-ms", "10"]
  gateway-1: {<<: *gateway, ports: ["8081:8080"]}
  gateway-2: {<<: *gateway, ports: ["8082:8080"]}
  gateway-3: {<<: *gateway, ports: ["8083:8080"]}
  prometheus:
    image: prom/prometheus:v2.54.1
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
