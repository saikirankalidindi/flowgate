[project]
name = "flowgate"
version = "0.1.0"
description = "LLM-aware gateway that enforces per-tenant token budgets across replicas without overshooting."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Sai Kiran Kalidindi" }]
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.10",
    "redis[hiredis]>=5.0",
    "pyyaml>=6.0",
    "prometheus-client>=0.20",
    "uvloop>=0.19; sys_platform != 'win32'",
]

[project.optional-dependencies]
bench = ["matplotlib>=3.8", "numpy>=1.26"]

[project.scripts]
flowgate = "flowgate.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flowgate"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["SIM115", "B905", "SIM105"]
